# Incluir dentro del bloque server HTTPS elegido, después de revisarlo.
# No sustituir la ubicación raíz existente de SIGXIA.
# Requiere antes deploy/nginx-http.conf (zona gesplaft_login).
location = /gesplaft { return 308 /gesplaft/; }

# Límite específico para el login (además del límite por cuenta/IP de la aplicación).
location = /gesplaft/auth/login {
    limit_req zone=gesplaft_login burst=5 nodelay;
    proxy_pass http://127.0.0.1:8094;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 8k;
    proxy_read_timeout 30s;
}

location ^~ /gesplaft/ {
    proxy_pass http://127.0.0.1:8094;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Reemplaza cabeceras de reenvío no confiables.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 1m;
    proxy_read_timeout 60s;
    # HSTS: activar solo cuando el HTTPS del dominio esté verificado.
    add_header Strict-Transport-Security "max-age=31536000" always;
}
